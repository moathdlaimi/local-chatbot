<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Ticket Analyzer</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <h1>Ticket Analyzer</h1>

    <label for="ticket">Enter your support ticket:</label>
    <br>
    <textarea
      id="ticket"
      rows="8"
      cols="60"
      placeholder="Describe the issue..."
    ></textarea>

    <br>
    <button type="button" id="analyze">Analyze</button>

    <h2>Results</h2>
    <p id="results">Your analysis will appear here.</p>
    <script src="App.js"></script>
  </body>
</html>
